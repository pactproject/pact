name: Artifact Keeper compatibility

on:
  pull_request:
    paths:
      - "pact-api/**"
      - "pact-core/**"
      - "pact-kubernetes/**"
      - "pact-artifact-keeper/**"
      - "integration/**"
      - "pom.xml"
      - ".github/workflows/artifact-keeper-compatibility.yml"
  push:
    branches: [master]
    paths:
      - "pact-api/**"
      - "pact-core/**"
      - "pact-kubernetes/**"
      - "pact-artifact-keeper/**"
      - "integration/**"
      - "pom.xml"
      - ".github/workflows/artifact-keeper-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "1.5.1"
            api_profile: legacy
          - version: "1.11.1"
            api_profile: current
    env:
      ARTIFACT_KEEPER_VERSION: ${{ matrix.version }}
      PACT_IT_ARTIFACT_KEEPER_API_PROFILE: ${{ matrix.api_profile }}
      ARTIFACT_KEEPER_URL: http://localhost:8080
      ARTIFACT_KEEPER_INITIAL_PASSWORD: PactLocalInitial1!
      ARTIFACT_KEEPER_ADMIN_PASSWORD: PactLocalAdmin2!
      ARTIFACT_KEEPER_TEST_USER: pact-it-user
      ARTIFACT_KEEPER_TEST_USER_PASSWORD: PactLocalUser3!
      ARTIFACT_KEEPER_TEST_REPOSITORY: pact-it-repo-a
      PACT_IT_ARTIFACT_KEEPER_URL: http://localhost:8080
      PACT_IT_ARTIFACT_KEEPER_ADMIN_PASSWORD: PactLocalAdmin2!
      PACT_IT_ARTIFACT_KEEPER_USER: pact-it-user
      PACT_IT_ARTIFACT_KEEPER_REPOSITORY: pact-it-repo-a
      PACT_IT_BACKEND_MODULES: pact-artifact-keeper
      PACT_IT_BACKEND_TESTS: ArtifactKeeperLiveIntegrationTest,ArtifactKeeperEnforcementLiveIntegrationTest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit and HTTP contract tests
        run: mvn -B -pl pact-artifact-keeper -am test
      - name: Start isolated Artifact Keeper
        run: docker compose -p pact-ak-compat -f integration/compose.yaml up -d --wait --wait-timeout 300 artifact-keeper
      - name: Bootstrap fixtures
        run: bash integration/scripts/bootstrap-artifact-keeper.sh
      - name: Start independent TCP peers for current-profile CIDR checks
        if: matrix.api_profile == 'current'
        run: |
          docker compose -p pact-ak-compat -f integration/compose.yaml --profile ak-enforcement up -d --wait --wait-timeout 60 artifact-keeper-allowed-probe artifact-keeper-denied-probe
          echo 'PACT_IT_ARTIFACT_KEEPER_ALLOWED_PROBE_URL=http://localhost:18088' >> "$GITHUB_ENV"
          echo 'PACT_IT_ARTIFACT_KEEPER_DENIED_PROBE_URL=http://localhost:18089' >> "$GITHUB_ENV"
          probe_ip=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' pact-ak-compat-artifact-keeper-allowed-probe-1)
          echo "PACT_IT_ARTIFACT_KEEPER_ALLOWED_PROBE_HOST=$probe_ip" >> "$GITHUB_ENV"
      - name: Live reconciliation and service-account access
        run: bash integration/scripts/run-backend-live-tests.sh
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifact-keeper-${{ matrix.version }}-reports
          path: pact-artifact-keeper/target/surefire-reports/
      - name: Remove disposable stack
        if: always()
        run: docker compose -p pact-ak-compat -f integration/compose.yaml --profile ak-enforcement down -v

  kubernetes-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ARTIFACT_KEEPER_VERSION: "1.11.1"
      PACT_IT_ARTIFACT_KEEPER_API_PROFILE: current
    steps:
      - uses: actions/checkout@v4
      - name: Build runner and start disposable Kubernetes and Artifact Keeper
        run: |
          docker compose --env-file integration/.env.example -p pact-ak-k8s -f integration/compose.yaml --profile kubernetes build artifact-keeper-bootstrap
          docker compose --env-file integration/.env.example -p pact-ak-k8s -f integration/compose.yaml --profile kubernetes up -d --wait --wait-timeout 300 artifact-keeper pact-kubernetes
      - name: Named YAML and separate-JVM restart E2E
        run: docker compose --env-file integration/.env.example -p pact-ak-k8s -f integration/compose.yaml --profile kubernetes run --name pact-ak-k8s-reports kubernetes-artifact-keeper-tests
      - name: Collect reports
        if: always()
        run: docker cp pact-ak-k8s-reports:/workspace/pact-kubernetes/target/surefire-reports ./kubernetes-reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kubernetes-artifact-keeper-reports
          path: kubernetes-reports/
      - name: Remove disposable stack
        if: always()
        run: docker compose --env-file integration/.env.example -p pact-ak-k8s -f integration/compose.yaml --profile kubernetes down -v
