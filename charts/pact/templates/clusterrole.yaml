{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "pact.fullname" . }}
  labels:
    {{- include "pact.labels" . | nindent 4 }}
rules:
  - apiGroups: [{{ .Values.dataAccess.group | quote }}]
    resources: [{{ .Values.dataAccess.plural | quote }}]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [{{ .Values.dataAccess.group | quote }}]
    resources: [{{ printf "%s/status" .Values.dataAccess.plural | quote }}]
    verbs: ["patch"]
{{- end }}
