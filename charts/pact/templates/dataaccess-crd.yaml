{{- if .Values.crd.create }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: {{ .Values.dataAccess.plural }}.{{ .Values.dataAccess.group }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "pact.labels" . | nindent 4 }}
spec:
  group: {{ .Values.dataAccess.group | quote }}
  scope: Namespaced
  names:
    plural: {{ .Values.dataAccess.plural }}
    singular: {{ .Values.dataAccess.singular }}
    kind: DataAccess
    shortNames:
      - da
  versions:
    - name: {{ .Values.dataAccess.version }}
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
{{- end }}
