{{- if .Values.secretAccess.create }}
{{- range $grant := .Values.secretAccess.grants }}
{{- $namespace := required "secretAccess.grants[].namespace is required" $grant.namespace }}
{{- $names := required "secretAccess.grants[].names must list Secret names" $grant.names }}
{{- if eq (len $names) 0 }}
{{- fail "secretAccess.grants[].names must contain at least one Secret name" }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "pact.fullname" $ }}-secret-reader
  namespace: {{ $namespace }}
  labels:
    {{- include "pact.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      {{- toYaml $names | nindent 6 }}
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "pact.fullname" $ }}-secret-reader
  namespace: {{ $namespace }}
  labels:
    {{- include "pact.labels" $ | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "pact.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "pact.fullname" $ }}-secret-reader
{{- end }}
{{- end }}
