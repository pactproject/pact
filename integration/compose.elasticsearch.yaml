# Disposable TLS-enabled Elasticsearch 9.2.3 for focused backend integration tests.
services:
  elasticsearch-certificates:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.3
    user: "0"
    entrypoint: ["bash", "/integration/create-certificates.sh"]
    volumes:
      - ./elasticsearch/create-certificates.sh:/integration/create-certificates.sh:ro
      - elasticsearch_certificates:/certificates

  pact-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.3
    depends_on:
      elasticsearch-certificates:
        condition: service_completed_successfully
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "true"
      xpack.security.http.ssl.key: certificates/server/server.key
      xpack.security.http.ssl.certificate: certificates/server/server.crt
      xpack.security.http.ssl.certificate_authorities: certificates/ca/ca.crt
      ELASTIC_PASSWORD: ${PACT_IT_ELASTICSEARCH_PASSWORD:-PactLocalElastic2!}
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch_certificates:/usr/share/elasticsearch/config/certificates:ro
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "${PACT_ELASTICSEARCH_PORT:-19201}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --cacert config/certificates/ca/ca.crt -u \"elastic:$${ELASTIC_PASSWORD}\" https://localhost:9200/_security/_authenticate >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 40
      start_period: 60s

volumes:
  elasticsearch_certificates:
  elasticsearch_data:
